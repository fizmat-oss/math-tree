<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tree of Mathematics — every box is a link</title>
<style>
:root{
  --bg:#07080c; --bg2:#10131a; --bg3:#171c27; --bg4:#1e2533;
  --line:#2a3142; --gold:#d4a84b; --gold2:#f0d78c;
  --cream:#efe6d3; --text:#d5d0c7; --muted:#8b8680; --faint:#5c5852;
  --found:#6aa56e; --core:#6b8fd4; --adv:#a78bd4; --res:#d47a6b;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --side:300px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
.app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:auto 1fr;height:100vh;min-height:0}
.top{
  grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:rgba(7,8,12,.92);backdrop-filter:blur(10px);z-index:5;
}
.brand{font-family:var(--serif);font-size:18px;color:var(--cream);white-space:nowrap}
.brand em{font-style:italic;color:var(--gold)}
.top input{
  flex:1;min-width:160px;max-width:420px;background:var(--bg3);border:1px solid var(--line);
  color:var(--cream);padding:8px 10px;border-radius:8px;font:inherit;outline:none;
}
.top input:focus{border-color:#7a6230}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.btn:hover{border-color:#7a6230;color:var(--cream)}
.crumbs{font-size:12.5px;color:var(--muted);width:100%;padding-left:2px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--gold2)}
.crumbs span{color:var(--faint);margin:0 6px}

.side{
  overflow:auto;border-right:1px solid var(--line);background:var(--bg2);padding:10px 0 40px;
}
.side h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:8px 14px}
.nav-item{--d:0}
.nav-row{display:flex;align-items:center;gap:4px;padding:2px 10px 2px calc(10px + var(--d)*12px)}
.nav-row:hover{background:var(--bg3)}
.nav-row.current{background:var(--bg4)}
.nav-row.current>a{color:var(--gold2)}
.twisty,.leafdot{
  width:16px;flex:none;background:none;border:0;color:var(--gold);cursor:pointer;font-family:var(--mono);font-size:12px;padding:0;text-align:center;
}
.nav-row>a{flex:1;color:var(--text);font-size:13px;line-height:1.35;padding:3px 0}
.nav-row>a:hover{color:var(--gold2)}
.nav-kids{display:none}
.nav-item.open>.nav-kids{display:block}
.nav-item.open>.nav-row>.twisty{transform:rotate(90deg)}
.lvl-dot{width:7px;height:7px;border-radius:50%;flex:none;margin-right:2px}

.main{overflow:auto;padding:22px 28px 80px;min-width:0}
.hero-title{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,44px);color:var(--cream);margin:0 0 8px;letter-spacing:-.02em}
.hero-sum{color:var(--muted);max-width:760px;margin:0 0 18px;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:4px 8px;border-radius:999px;color:var(--muted)}
.pill.l-foundation{color:var(--found);border-color:rgba(106,165,110,.4)}
.pill.l-core{color:var(--core);border-color:rgba(107,143,212,.4)}
.pill.l-advanced{color:var(--adv);border-color:rgba(167,139,212,.4)}
.pill.l-research{color:var(--res);border-color:rgba(212,122,107,.4)}
.pill.l-root{color:var(--gold);border-color:var(--gold)}

/* visual tree of child boxes */
.forest{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:8px 0 32px}
.trunk{
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;
  border-top:3px solid var(--c, var(--gold));
}
.trunk>a.box{
  display:block;font-family:var(--serif);font-size:18px;color:var(--cream);padding:4px 6px 8px;
}
.trunk>a.box:hover{color:var(--gold2)}
.trunk ul{list-style:none;margin:0;padding:0}
.trunk li a{
  display:block;padding:5px 8px;margin:2px 0;border-radius:8px;color:var(--text);font-size:13.5px;
  background:var(--bg);border:1px solid transparent;
}
.trunk li a:hover{border-color:var(--line);color:var(--gold2);background:var(--bg3)}
.trunk li a small{display:block;color:var(--faint);font-size:11px}

/* org tree for focused node */
.org-wrap{margin:6px 0 28px;overflow-x:auto;padding-bottom:8px}
.org{display:flex;flex-direction:column;align-items:center}
.org-node{
  display:inline-block;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;color:var(--cream);font-family:var(--serif);font-size:15px;
  border-bottom:3px solid var(--c, var(--gold));
}
a.org-node:hover{border-color:var(--gold);color:var(--gold2)}
.org>ul{
  display:flex;justify-content:center;flex-wrap:wrap;gap:0;list-style:none;margin:0;padding:18px 0 0;position:relative;
}
.org>ul:before{
  content:"";position:absolute;top:0;left:50%;height:18px;width:1px;background:var(--line);
}
.org>ul>li{display:flex;flex-direction:column;align-items:center;padding:0 8px;position:relative}
.org>ul>li:before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line);
}
.org>ul>li:first-child:before{left:50%}
.org>ul>li:last-child:before{right:50%}
.org>ul>li:after{
  content:"";position:absolute;top:0;left:50%;width:1px;height:12px;background:var(--line);
}
.org>ul>li>.org-node{margin-top:12px}
.org .kids{
  display:flex;flex-direction:column;gap:4px;margin-top:10px;min-width:160px;
}
.org .kids a{
  display:block;font-size:12.5px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);
  border-radius:7px;padding:5px 8px;
}
.org .kids a:hover{color:var(--gold2);border-color:#7a6230}

.section{margin:22px 0}
.section h3{
  font-family:var(--serif);font-weight:400;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;
}
.topics{margin:0;padding-left:18px}
.topics li{margin:4px 0}
.topics h4{font-size:14px;color:var(--cream);margin:12px 0 4px;font-weight:600}
.thbox,.bookbox{
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;
}
.linkrow{display:flex;flex-wrap:wrap;gap:8px}
.linkrow a{
  background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px;
}
.linkrow a:hover{border-color:var(--gold);color:var(--gold2)}
.search-hits{display:flex;flex-direction:column;gap:6px;max-width:720px}
.search-hits a{display:block;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text)}
.search-hits a:hover{border-color:var(--gold)}
.search-hits b{color:var(--cream)}
.search-hits span{display:block;color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);max-width:720px}
.empty{color:var(--muted);font-style:italic}
@media(max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .side{grid-row:3;max-height:34vh;border-right:0;border-top:1px solid var(--line)}
  .main{grid-row:2}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">The Tree of <em>Mathematics</em></div>
    <input id="q" type="search" placeholder="Search any field, theorem, topic…  (/)" autocomplete="off">
    <button class="btn" id="homeBtn">Root</button>
    <button class="btn" id="expandNav">Expand nav</button>
    <div class="crumbs" id="crumbs"></div>
  </header>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

const byId = {};
(function index(n, parent){
  n.parent = parent || null;
  byId[n.id] = n;
  (n.children || []).forEach(c => index(c, n));
})(TREE);

function pathOf(n){
  const p = [];
  while (n){ p.push(n); n = n.parent; }
  return p.reverse();
}
function lvlClass(l){ return "l-" + (l || "core"); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function navHTML(n, depth){
  const kids = n.children || [];
  const has = kids.length > 0;
  return `<div class="nav-item" data-id="${n.id}" style="--d:${depth}">
    <div class="nav-row">
      ${has ? `<button class="twisty" aria-label="toggle">▸</button>` : `<span class="leafdot">·</span>`}
      <a href="#${n.id}">${esc(n.title)}</a>
    </div>
    ${has ? `<div class="nav-kids">${kids.map(c => navHTML(c, depth+1)).join("")}</div>` : ""}
  </div>`;
}

function renderNav(){
  document.getElementById("side").innerHTML = `<h2>All nodes as links</h2>` + navHTML(TREE, 0);
  document.getElementById("side").addEventListener("click", e => {
    const t = e.target.closest(".twisty");
    if (!t) return;
    e.preventDefault();
    t.closest(".nav-item").classList.toggle("open");
  });
}

function openAncestors(id){
  document.querySelectorAll(".nav-row.current").forEach(el => el.classList.remove("current"));
  let n = byId[id];
  while (n){
    const item = document.querySelector(`.nav-item[data-id="${n.id}"]`);
    if (item){
      item.classList.add("open");
      const row = item.querySelector(":scope > .nav-row");
      if (n.id === id && row) row.classList.add("current");
    }
    n = n.parent;
  }
}

function crumbs(n){
  return pathOf(n).map((p,i,a) =>
    i === a.length-1 ? `<strong style="color:var(--cream)">${esc(p.title)}</strong>`
                     : `<a href="#${p.id}">${esc(p.title)}</a>`
  ).join(`<span>/</span>`);
}

function topicList(topics){
  if (!topics || !topics.length) return "";
  let html = `<ul class="topics">`;
  for (const t of topics){
    if (t && typeof t === "object" && t.h){
      html += `</ul><h4>${esc(t.h)}</h4><ul class="topics">`;
      for (const it of t.items) html += `<li>${esc(it)}</li>`;
    } else {
      html += `<li>${esc(t)}</li>`;
    }
  }
  html += `</ul>`;
  return html;
}

function links(ids){
  if (!ids || !ids.length) return `<span class="empty">—</span>`;
  return `<div class="linkrow">${ids.map(id => {
    const n = byId[id];
    return n ? `<a href="#${id}">${esc(n.title)}</a>` : "";
  }).join("")}</div>`;
}

function childForest(n){
  const kids = n.children || [];
  if (!kids.length) return "";
  // At root (and other fat nodes): a forest of trunks, each trunk a linked box with linked children
  const fat = kids.length > 8 || kids.some(c => (c.children||[]).length);
  if (fat){
    return `<div class="forest">${kids.map(c => {
      const grand = (c.children || []).slice(0, 14);
      const more = (c.children||[]).length - grand.length;
      return `<article class="trunk" style="--c:${c.color||n.color}">
        <a class="box" href="#${c.id}">${esc(c.title)}</a>
        <ul>${grand.map(g => `<li><a href="#${g.id}">${esc(g.title)}</a></li>`).join("")}
        ${more>0 ? `<li><a href="#${c.id}"><small>+ ${more} more</small></a></li>` : ""}</ul>
      </article>`;
    }).join("")}</div>`;
  }
  // Small: org-chart of boxes
  return `<div class="org-wrap"><div class="org">
    <a class="org-node" href="#${n.id}" style="--c:${n.color}">${esc(n.title)}</a>
    <ul>${kids.map(c => {
      const g = (c.children||[]).slice(0,8);
      return `<li>
        <a class="org-node" href="#${c.id}" style="--c:${c.color||n.color}">${esc(c.title)}</a>
        ${g.length ? `<div class="kids">${g.map(x => `<a href="#${x.id}">${esc(x.title)}</a>`).join("")}</div>` : ""}
      </li>`;
    }).join("")}</ul>
  </div></div>`;
}

function render(id){
  const n = byId[id] || TREE;
  document.getElementById("crumbs").innerHTML = crumbs(n);
  openAncestors(n.id);
  const kids = n.children || [];
  const main = document.getElementById("main");
  main.innerHTML = `
    <h1 class="hero-title">${esc(n.title)}</h1>
    <p class="hero-sum">${esc(n.summary || "")}</p>
    <div class="meta">
      <span class="pill ${lvlClass(n.level)}">${esc(n.level || "core")}</span>
      ${kids.length ? `<span class="pill">${kids.length} branches</span>` : `<span class="pill">leaf</span>`}
    </div>
    ${childForest(n)}
    ${n.prereq && n.prereq.length ? `<div class="section"><h3>Prerequisites (links)</h3>${links(n.prereq)}</div>` : ""}
    ${n.topics && n.topics.length ? `<div class="section"><h3>All parts &amp; details</h3>${topicList(n.topics)}</div>` : ""}
    ${n.theorems && n.theorems.length ? `<div class="section"><h3>Key theorems</h3><div class="thbox">${n.theorems.map(esc).join(" · ")}</div></div>` : ""}
    ${n.books && n.books.length ? `<div class="section"><h3>Canonical books</h3><div class="bookbox">${n.books.map(esc).join("<br>")}</div></div>` : ""}
    ${n.leads && n.leads.length ? `<div class="section"><h3>Leads to</h3>${links(n.leads)}</div>` : ""}
    ${!kids.length && !(n.topics||[]).length ? `<p class="note">This leaf inherits detail from its parent; use the tree on the left to keep walking.</p>` : ""}
    <p class="note" style="margin-top:36px">Every box and every sidebar title is a link. Hash URL: #${esc(n.id)}. Press / to search.</p>
  `;
  main.scrollTop = 0;
}

function search(term){
  term = term.trim().toLowerCase();
  if (!term){ render(location.hash.slice(1) || "math"); return; }
  const hits = [];
  for (const id of Object.keys(byId)){
    const n = byId[id];
    const blob = (n.title + " " + (n.summary||"") + " " + JSON.stringify(n.topics||[]) + " " + (n.theorems||[]).join(" ")).toLowerCase();
    if (blob.includes(term)) hits.push(n);
  }
  document.getElementById("crumbs").innerHTML = `Search · ${hits.length} nodes`;
  document.getElementById("main").innerHTML = `
    <h1 class="hero-title">Search</h1>
    <p class="hero-sum">${hits.length} matches for “${esc(term)}”. Every result is a link into the tree.</p>
    <div class="search-hits">${hits.slice(0,80).map(n =>
      `<a href="#${n.id}"><b>${esc(n.title)}</b><span>${esc((n.summary||"").slice(0,180))}</span></a>`
    ).join("")}</div>`;
}

function go(){
  const q = document.getElementById("q");
  if (q.value.trim()){ search(q.value); return; }
  render((location.hash || "#math").slice(1) || "math");
}

renderNav();
document.getElementById("homeBtn").onclick = () => { document.getElementById("q").value=""; location.hash = "math"; };
document.getElementById("expandNav").onclick = () => {
  const items = [...document.querySelectorAll(".nav-item")];
  const allOpen = items.every(i => !i.querySelector(".nav-kids") || i.classList.contains("open"));
  items.forEach(i => i.classList.toggle("open", !allOpen));
};
document.getElementById("q").addEventListener("input", e => {
  if (!e.target.value) go();
  else search(e.target.value);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "Escape"){ document.getElementById("q").value=""; go(); }
});
window.addEventListener("hashchange", go);
go();
</script>
</body>
</html>
